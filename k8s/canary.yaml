apiVersion: apps/v1
kind: Deployment
metadata:
  name: ielo-app-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ielo-app
      track: canary
  template:
    metadata:
      labels:
        app: ielo-app
        track: canary
    spec:
      containers:
        - name: ielo-app
          image: docker.io/ielo/ielo_harness_ci:k8s-2
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
