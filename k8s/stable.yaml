apiVersion: apps/v1
kind: Deployment
metadata:
  name: ielo-app
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ielo-app
      track: stable
  template:
    metadata:
      labels:
        app: ielo-app
        track: stable
    spec:
      containers:
        - name: ielo-app
          image: docker.io/ielo/ielo_harness_ci:k8s-2
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ielo-app
spec:
  type: ClusterIP
  selector:
    app: ielo-app
  ports:
    - port: 80
      targetPort: 8080
