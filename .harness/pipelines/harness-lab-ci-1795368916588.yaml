pipeline:
  name: Build harness-lab-ci
  identifier: Build_ielo_harness_lab_ci_1795368949731
  projectIdentifier: Rafa_Ielo
  orgIdentifier: default
  stages:
    - stage:
        name: Build
        identifier: Build
        type: CI
        spec:
          cloneCodebase: true
          execution:
            steps:
              - step:
                  type: Run
                  name: mv_build
                  identifier: mv_build
                  spec:
                    registryRef: ielo_docker
                    image: maven:3.9-eclipse-temurin-17
                    shell: Sh
                    command: mvn clean package -DskipTests
              - step:
                  type: Run
                  name: tests
                  identifier: tests
                  spec:
                    registryRef: ielo_docker
                    image: maven:3.9-eclipse-temurin-17
                    shell: Sh
                    command: mvn test
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - target/surefire-reports/*.xml
              - step:
                  type: BuildAndPushDockerRegistry
                  name: build_and_push
                  identifier: build_and_push
                  spec:
                    repo: ielo/ielo_harness_ci
                    tags:
                      - <+pipeline.sequenceId>
                      - latest
                    registryRef: ielo_docker
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Docker
            spec:
              harnessImageConnectorRef: ielodocker
        description: ""
        delegateSelectors:
          - ielo-delegate
  properties:
    ci:
      codebase:
        connectorRef: account.Github
        repoName: ielo/harness-lab-ci
        build: <+input>
